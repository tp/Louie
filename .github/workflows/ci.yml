name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check generated Linn gateway models
        run: |
          bash server/linn-ci-gateway/normalize.sh
          bash server/linn-ci-gateway/generate.sh
          git diff --exit-code -- server/linn-ci-gateway/openapi.yaml server/linn-ci-gateway/src/models

      - name: Check formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: server
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        working-directory: server
        run: cargo test --workspace --locked --all-targets

      - name: Build release binary
        working-directory: server
        run: cargo build --release --locked

  packages:
    name: Swift packages
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.0"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check generated Linn gRPC client
        run: |
          protoc_dir="$RUNNER_TEMP/protoc-32.1"
          protoc_zip="$RUNNER_TEMP/protoc-32.1.zip"
          curl --fail --location --silent --show-error \
            https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-osx-universal_binary.zip \
            --output "$protoc_zip"
          echo "95a1e03847cf7057b2db1b68fb92685c3cd9d14e777a879475663adc13989cd7  $protoc_zip" \
            | shasum -a 256 --check
          unzip -q "$protoc_zip" -d "$protoc_dir"
          PATH="$protoc_dir/bin:$PATH" bash Packages/Linn/generate-proto.sh
          git diff --exit-code -- Packages/Linn/Sources/Linn/Generated

      - name: Build & test Linn
        working-directory: Packages/Linn
        run: swift test --parallel

  app:
    name: iOS app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.0"

      - name: Build Louie (generic iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -project Louie.xcodeproj \
            -scheme Louie \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build \
            | xcbeautify --renderer github-actions

      - name: Test Louie unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Louie.xcodeproj \
            -scheme Louie \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:LouieTests \
            -skipPackagePluginValidation \
            test \
            | xcbeautify --renderer github-actions

  macos:
    name: macOS app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.0"

      - name: Build Louie (macOS)
        run: |
          set -o pipefail
          xcodebuild \
            -project Louie.xcodeproj \
            -scheme Louie \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build \
            | xcbeautify --renderer github-actions
