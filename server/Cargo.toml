[package]
name = "louie-server"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["linn-ci-gateway"]
default-members = [".", "linn-ci-gateway"]
resolver = "3"

[dependencies]
futures-util = "0.3"
linn-ci-gateway = { path = "linn-ci-gateway" }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.28"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "=3.3.0"
tonic-prost-build = "0.14"
